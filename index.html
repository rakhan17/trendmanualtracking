<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimalist AR Geometric Filter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            overflow: hidden;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }
        #input_video {
            display: none;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @media screen and (orientation: portrait) {
            #rotate-warning { display: flex !important; }
        }
    </style>
</head>
<body class="text-white h-screen w-screen relative select-none">

    <!-- Force Landscape Warning -->
    <div id="rotate-warning" class="hidden absolute inset-0 z-[100] bg-black/95 flex-col items-center justify-center text-center p-6">
        <svg class="w-12 h-12 mb-4 animate-bounce text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
        <p class="tracking-widest text-sm uppercase">Please Rotate to Landscape</p>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/90 backdrop-blur-md transition-opacity duration-700">
        <h1 class="text-3xl font-light tracking-[0.2em] mb-4">GEOMETRIC AR</h1>
        <p class="text-white/50 text-xs mb-8 tracking-wider text-center max-w-md px-4 leading-relaxed">
            2 Fingers = Connect Line.<br>
            3 Fingers = Halftone Dots.<br>
            4 Fingers = Multi-FX Geometry.<br>
            Ensure well-lit environment.
        </p>
        <button id="start-btn" class="glass-panel px-8 py-3 rounded-full uppercase tracking-widest text-sm hover:bg-white/10 transition-colors border-white/20">
            Initialize Camera
        </button>
        <div id="loading-text" class="hidden mt-6 text-white/50 text-xs tracking-widest animate-pulse uppercase">
            Waking up Neural Net...
        </div>
    </div>

    <!-- Main Render Targets -->
    <video id="input_video" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer" class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-6 opacity-0 transition-opacity duration-1000">
        <!-- Top Info -->
        <div class="flex justify-between items-start w-full">
            <div class="flex items-center space-x-3">
                <div class="w-2 h-2 rounded-full bg-white animate-pulse"></div>
                <span id="status-text" class="text-[10px] uppercase tracking-[0.2em] font-semibold text-white/80">TRACKING: SEARCHING...</span>
            </div>
            <div class="text-[10px] uppercase tracking-[0.2em] text-white/50">
                1080P - 60FPS
            </div>
        </div>

        <!-- Controls -->
        <div class="flex justify-between items-end w-full">
            <div class="w-16 h-16 rounded-full border border-white/30 flex items-center justify-center p-1 backdrop-blur-sm pointer-events-auto cursor-pointer hover:border-white transition-colors" onclick="flashScreen()">
                <div class="w-full h-full bg-white/20 rounded-full"></div>
            </div>
        </div>
    </div>

    <div id="flash" class="absolute inset-0 z-[100] bg-white opacity-0 pointer-events-none transition-opacity duration-100"></div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const ctx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status-text');

    // Offscreen buffers to handle the "Mirror Bug" and effects flawlessly
    const flippedCanvas = document.createElement('canvas');
    const flippedCtx = flippedCanvas.getContext('2d');
    const smallCanvas = document.createElement('canvas');
    const smallCtx = smallCanvas.getContext('2d');

    // Patterns for FX
    let halftonePattern, noisePattern, duotoneGradient;

    // Viewport Math
    let renderWidth, renderHeight, xOffset, yOffset;

    function flashScreen() {
        const flash = document.getElementById('flash');
        flash.style.opacity = '1';
        setTimeout(() => flash.style.opacity = '0', 100);
    }

    function resizeAndGeneratePatterns() {
        canvasElement.width = window.innerWidth;
        canvasElement.height = window.innerHeight;
        flippedCanvas.width = canvasElement.width;
        flippedCanvas.height = canvasElement.height;
        
        // Pattern 1: Halftone / Polka Dot (Noise Bulat)
        const dot = document.createElement('canvas');
        dot.width = 10; dot.height = 10;
        const dctx = dot.getContext('2d');
        dctx.fillStyle = 'white'; dctx.fillRect(0,0,10,10);
        dctx.fillStyle = '#444'; 
        dctx.beginPath(); dctx.arc(5,5, 3.5, 0, Math.PI*2); dctx.fill();
        halftonePattern = ctx.createPattern(dot, 'repeat');

        // Pattern 2: Film Grain
        const noise = document.createElement('canvas');
        noise.width = 128; noise.height = 128;
        const nctx = noise.getContext('2d');
        const imgData = nctx.createImageData(128, 128);
        for(let i=0; i<imgData.data.length; i+=4) {
            const v = Math.random() * 255;
            imgData.data[i] = v; imgData.data[i+1] = v; imgData.data[i+2] = v; imgData.data[i+3] = 45; 
        }
        nctx.putImageData(imgData, 0, 0);
        noisePattern = ctx.createPattern(noise, 'repeat');

        // Gradient: Cyber Duotone
    duotoneGradient = ctx.createLinearGradient(0, 0, canvasElement.width, canvasElement.height);
    duotoneGradient.addColorStop(0, '#ff007f');
    duotoneGradient.addColorStop(1, '#00e5ff');
}
window.addEventListener('resize', resizeAndGeneratePatterns);
resizeAndGeneratePatterns();

// Find center X for 4 points
function getIntersection(p1, p2, p3, p4) {
        const det = (p1.x - p2.x) * (p3.y - p4.y) - (p1.y - p2.y) * (p3.x - p4.x);
        if (det === 0) return null; 
        const x = ((p1.x * p2.y - p1.y * p2.x) * (p3.x - p4.x) - (p1.x - p2.x) * (p3.x * p4.y - p3.y * p4.x)) / det;
        const y = ((p1.x * p2.y - p1.y * p2.x) * (p3.y - p4.y) - (p1.y - p2.y) * (p3.x * p4.y - p3.y * p4.x)) / det;
        return { x, y };
    }

    function drawFilteredArea(points, effect) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
        ctx.closePath();
        
        ctx.clip(); // Masking to the geometric shape

        if (effect === 'pixelate') {
            // Draw pixelated image by downscaling then upscaling
            const pixelSize = 12;
            smallCanvas.width = canvasElement.width / pixelSize;
            smallCanvas.height = canvasElement.height / pixelSize;
            smallCtx.drawImage(flippedCanvas, 0, 0, smallCanvas.width, smallCanvas.height);
            
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(smallCanvas, 0, 0, canvasElement.width, canvasElement.height);
            ctx.imageSmoothingEnabled = true;
            
        } else if (effect === 'halftone') {
            ctx.filter = 'grayscale(100%) contrast(150%)';
            ctx.drawImage(flippedCanvas, 0, 0);
            ctx.filter = 'none';
            ctx.globalCompositeOperation = 'multiply';
            ctx.fillStyle = halftonePattern;
            ctx.fillRect(0, 0, canvasElement.width, canvasElement.height);

        } else if (effect === 'noise') {
            ctx.filter = 'sepia(80%) contrast(130%) saturate(150%)';
            ctx.drawImage(flippedCanvas, 0, 0);
            ctx.filter = 'none';
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillStyle = noisePattern;
            ctx.fillRect(0, 0, canvasElement.width, canvasElement.height);

        } else if (effect === 'duotone') {
            ctx.filter = 'grayscale(100%) contrast(150%)';
            ctx.drawImage(flippedCanvas, 0, 0);
            ctx.filter = 'none';
            ctx.globalCompositeOperation = 'overlay'; // screen or overlay for cyber vibe
            ctx.fillStyle = duotoneGradient;
            ctx.fillRect(0, 0, canvasElement.width, canvasElement.height);
        }
        
        ctx.restore();
    }

    function drawLines(points, isClosed) {
        if (!points || points.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
        }
        if (isClosed) ctx.closePath();
        
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.stroke();
    }

    function getDist(p1, p2) {
        return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
    }

    function onResults(results) {
        if (!videoElement.videoWidth) return;

        // 1. Precise Math to scale video to "Object-Fit: Cover" 
        const videoRatio = videoElement.videoWidth / videoElement.videoHeight;
        const canvasRatio = canvasElement.width / canvasElement.height;
        
        if (canvasRatio > videoRatio) {
            renderWidth = canvasElement.width;
            renderHeight = canvasElement.width / videoRatio;
            xOffset = 0;
            yOffset = (canvasElement.height - renderHeight) / 2;
        } else {
            renderWidth = canvasElement.height * videoRatio;
            renderHeight = canvasElement.height;
            xOffset = (canvasElement.width - renderWidth) / 2;
            yOffset = 0;
        }

        // 2. Pre-render a perfectly mirrored frame to Offscreen Buffer
        // This permanently solves the "Left becomes Right inside the filter" bug!
        flippedCtx.clearRect(0, 0, flippedCanvas.width, flippedCanvas.height);
        flippedCtx.save();
        flippedCtx.translate(xOffset + renderWidth, yOffset);
        flippedCtx.scale(-1, 1);
        flippedCtx.drawImage(videoElement, 0, 0, renderWidth, renderHeight);
        flippedCtx.restore();

        // 3. Draw Normal Background
        ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        ctx.drawImage(flippedCanvas, 0, 0);

        let activePoints = [];
        if (results.multiHandLandmarks) {
            for (const landmarks of results.multiHandLandmarks) {
                // Map [0,1] landmarks perfectly to the cropped/mirrored canvas
                const mapPoint = (lm) => ({
                    x: xOffset + (1 - lm.x) * renderWidth, // (1 - x) to account for mirror
                    y: yOffset + lm.y * renderHeight
                });
                
                // Mengambil titik tulang (landmarks)
                const wrist = landmarks[0]; // Pergelangan
                const thumbTip = landmarks[4]; // Ujung jempol
                const thumbMCP = landmarks[2]; // Pangkal jempol
                const indexTip = landmarks[8]; // Ujung telunjuk
                const indexPIP = landmarks[6]; // Sendi tengah telunjuk

                // Fungsi batas visibilitas (mengecek apakah jari benar-benar ada di layar kamera)
                const isVisible = (lm) => lm.x >= -0.1 && lm.x <= 1.1 && lm.y >= -0.1 && lm.y <= 1.1;

                // Logika Cerdas: 
                // Jika jarak ujung jari ke pergelangan lebih jauh dari sendi pangkal ke pergelangan, 
                // berarti jari sedang tegak/dibuka. Jika ditekuk atau disembunyikan, nilainya salah.
                const isThumbOpen = getDist(thumbTip, wrist) > getDist(thumbMCP, wrist) && isVisible(thumbTip);
                const isIndexOpen = getDist(indexTip, wrist) > getDist(indexPIP, wrist) && isVisible(indexTip);

                if (isThumbOpen) activePoints.push(mapPoint(thumbTip)); // Masukkan Jempol
                if (isIndexOpen) activePoints.push(mapPoint(indexTip)); // Masukkan Telunjuk
            }
        }

        if (activePoints.length > 4) activePoints = activePoints.slice(0, 4);

        // Update UI
        statusText.innerText = `TRACKING: ${activePoints.length} POINTS`;

        if (activePoints.length === 2) {
            // STATE 1: 2 Fingers = Simple Connecting Line (No Area)
            drawLines(activePoints, false);

        } else if (activePoints.length === 3) {
            // STATE 2: 3 Fingers = Triangle Area
            drawFilteredArea(activePoints, 'halftone');
            drawLines(activePoints, true);

        } else if (activePoints.length === 4) {
            // STATE 3: 4 Fingers = Complex 'X' Geometry
            // Mengurutkan titik secara melingkar (berdasarkan sudut dari titik berat/tengah)
            // Ini mencegah efek "bocor" (bentuk pita/silang) saat jari ditukar posisinya
            const cx = (activePoints[0].x + activePoints[1].x + activePoints[2].x + activePoints[3].x) / 4;
            const cy = (activePoints[0].y + activePoints[1].y + activePoints[2].y + activePoints[3].y) / 4;
            
            const sorted = activePoints.sort((p1, p2) => {
                return Math.atan2(p1.y - cy, p1.x - cx) - Math.atan2(p2.y - cy, p2.x - cx);
            });

            const A = sorted[0]; // Kiri Atas
            const B = sorted[1]; // Kanan Atas
            const C = sorted[2]; // Kanan Bawah
            const D = sorted[3]; // Kiri Bawah
            
            // Titik potong menyilang antar jari (Diagonal) sekarang PASTI selalu di dalam bentuk
            const center = getIntersection(A, C, B, D);

            if (center) {
                drawFilteredArea([A, B, center], 'pixelate'); // Top
                drawFilteredArea([B, C, center], 'duotone');  // Right
                drawFilteredArea([C, D, center], 'halftone'); // Bottom
                drawFilteredArea([D, A, center], 'noise');    // Left

                drawLines([A, B, C, D], true); // Garis keliling
                drawLines([A, C], false); // Cross line 1
                drawLines([B, D], false); // Cross line 2
            }
        }
    }

const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1, // MAKSIMAL ADALAH 1 (0 = Cepat, 1 = Paling Akurat). Jika 2 akan crash.
    minDetectionConfidence: 0.6, // Disesuaikan untuk akurasi lebih baik tanpa ngelag
    minTrackingConfidence: 0.6
});
hands.onResults(onResults);

    document.getElementById('start-btn').addEventListener('click', async () => {
        document.getElementById('start-btn').classList.add('hidden');
        document.getElementById('loading-text').classList.remove('hidden');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
            });
            videoElement.srcObject = stream;
            
            videoElement.onloadedmetadata = () => {
                videoElement.play();
                const camera = new Camera(videoElement, {
                    onFrame: async () => await hands.send({image: videoElement}),
                    width: 1280, height: 720
                });
                
                camera.start().then(() => {
                    const startScreen = document.getElementById('start-screen');
                    startScreen.style.opacity = '0';
                    setTimeout(() => startScreen.style.display = 'none', 700);
                    document.getElementById('ui-layer').style.opacity = '1';
                });
            };
        } catch (error) {
            console.error(error);
            document.getElementById('loading-text').innerText = "ERROR: Camera Access Denied.";
        }
    });

</script>
</body>
</html>
