<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            overflow: hidden;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }
        #input_video {
            display: none;
        }
        .glass-panel {
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Styling custom select elements */
        select {
            appearance: none;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            outline: none;
            font-size: 12px;
            cursor: pointer;
        }
        select option {
            background: #111;
            color: white;
        }
    </style>
</head>
<body class="text-white h-screen w-screen relative select-none">

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/90 backdrop-blur-md transition-opacity duration-700">
        <h1 class="text-3xl font-light tracking-[0.2em] mb-4">GEOMETRIC AR</h1>
        <p class="text-white/50 text-xs mb-8 tracking-wider text-center max-w-md px-4 leading-relaxed">
            2 Fingers = Connect Line.<br>
            4 Fingers = Multi-FX Geometry.<br>
            Supports both Portrait & Landscape!
        </p>
        <button id="start-btn" class="glass-panel px-8 py-3 rounded-full uppercase tracking-widest text-sm hover:bg-white/10 transition-colors border-white/20">
            Initialize Camera
        </button>
        <div id="loading-text" class="hidden mt-6 text-white/50 text-xs tracking-widest animate-pulse uppercase">
            Waking up Neural Net...
        </div>
    </div>

    <!-- Main Render Targets -->
    <video id="input_video" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden absolute inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-center justify-center">
        <div class="glass-panel p-6 rounded-xl w-80 flex flex-col space-y-4">
            <h2 class="text-sm tracking-[0.2em] text-white/80 border-b border-white/10 pb-2 mb-2">CAMERA SETTINGS</h2>
            
            <div class="flex flex-col space-y-1">
                <label class="text-[10px] uppercase tracking-widest text-white/50">LENS</label>
                <select id="sel-lens">
                    <option value="user">Front (Selfie)</option>
                    <option value="environment">Back (Main Camera)</option>
                </select>
            </div>
            
            <div class="flex flex-col space-y-1">
                <label class="text-[10px] uppercase tracking-widest text-white/50">RESOLUTION (IDEAL)</label>
                <select id="sel-res">
                    <option value="640x480">480p (Fastest)</option>
                    <option value="1280x720" selected>720p (Balanced)</option>
                    <option value="1920x1080">1080p (High Res)</option>
                    <option value="3840x2160">4K (Extreme)</option>
                </select>
            </div>

            <div class="flex flex-col space-y-1">
                <label class="text-[10px] uppercase tracking-widest text-white/50">TARGET FPS</label>
                <select id="sel-fps">
                    <option value="24">24 FPS (Cinematic)</option>
                    <option value="30">30 FPS (Standard)</option>
                    <option value="60" selected>60 FPS (Smooth)</option>
                    <option value="120">120 FPS (Ultra Smooth)</option>
                </select>
            </div>

            <div class="pt-4 flex justify-end space-x-3">
                <button onclick="toggleSettings()" class="text-xs tracking-widest text-white/50 hover:text-white px-3 py-2">CANCEL</button>
                <button onclick="applySettings()" class="text-xs tracking-widest bg-white text-black px-4 py-2 rounded hover:bg-white/80">APPLY & RESTART</button>
            </div>
        </div>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer" class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-6 opacity-0 transition-opacity duration-1000">
        <!-- Top Info -->
        <div class="flex justify-between items-start w-full">
            <div class="flex items-center space-x-3 pointer-events-auto">
                <div class="w-2 h-2 rounded-full bg-white animate-pulse"></div>
                <span id="status-text" class="text-[10px] uppercase tracking-[0.2em] font-semibold text-white/80">TRACKING: SEARCHING...</span>
            </div>
            <div class="flex flex-col items-end space-y-2 pointer-events-auto">
                <!-- Settings Button -->
                <button id="settings-btn" onclick="toggleSettings()" class="p-2 bg-black/20 rounded-full hover:bg-black/50 transition-colors backdrop-blur-sm border border-white/10">
                    <svg class="w-5 h-5 text-white/80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
                <div id="res-info" class="text-[10px] uppercase tracking-[0.2em] text-white/50 bg-black/20 px-2 py-1 rounded backdrop-blur-sm">
                    STARTING...
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex justify-end items-end w-full">
            <div id="record-btn" class="w-16 h-16 rounded-full border-2 border-white/50 flex items-center justify-center p-1 backdrop-blur-sm pointer-events-auto cursor-pointer hover:border-white transition-colors" onclick="toggleRecording()">
                <div id="record-indicator" class="w-[90%] h-[90%] bg-red-600 rounded-full transition-all duration-300 shadow-[0_0_15px_rgba(220,38,38,0.5)]"></div>
            </div>
        </div>
    </div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const ctx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status-text');
    const resInfo = document.getElementById('res-info');

    const flippedCanvas = document.createElement('canvas');
    const flippedCtx = flippedCanvas.getContext('2d');
    const smallCanvas = document.createElement('canvas');
    const smallCtx = smallCanvas.getContext('2d');

    let halftonePattern, noisePattern, duotoneGradient;
    let renderWidth, renderHeight, xOffset, yOffset;

    let currentStream = null;
    let currentLoopId = null;
    let lastVideoTime = -1;
    
    let configLens = 'user';
    let configWidth = 1280;
    let configHeight = 720;
    let configFps = 60;

    function toggleSettings() {
        const modal = document.getElementById('settings-modal');
        modal.classList.toggle('hidden');
    }

    async function applySettings() {
        toggleSettings();
        configLens = document.getElementById('sel-lens').value;
        const resStr = document.getElementById('sel-res').value.split('x');
        configWidth = parseInt(resStr[0]);
        configHeight = parseInt(resStr[1]);
        configFps = parseInt(document.getElementById('sel-fps').value);
        
        statusText.innerText = "TRACKING: RESTARTING LENS...";
        await startCustomCamera();
    }

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    function toggleRecording() {
        const indicator = document.getElementById('record-indicator');
        
        if (!isRecording) {
            recordedChunks = [];
            const stream = canvasElement.captureStream(configFps); 
            
            let options = { mimeType: 'video/webm;codecs=vp9' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm' }; 
            }

            mediaRecorder = new MediaRecorder(stream, options);
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'AR_Geometric_Record.webm';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
            };

            mediaRecorder.start();
            isRecording = true;
            
            indicator.classList.remove('w-[90%]', 'h-[90%]', 'rounded-full');
            indicator.classList.add('w-[40%]', 'h-[40%]', 'rounded-md');
            statusText.innerText = "RECORDING...";
            statusText.classList.add('text-red-500');
            document.getElementById('settings-btn').style.display = 'none';
        } else {
            mediaRecorder.stop();
            isRecording = false;
            
            indicator.classList.add('w-[90%]', 'h-[90%]', 'rounded-full');
            indicator.classList.remove('w-[40%]', 'h-[40%]', 'rounded-md');
            statusText.classList.remove('text-red-500');
            document.getElementById('settings-btn').style.display = 'block';
        }
    }

    function resizeAndGeneratePatterns() {
        canvasElement.width = window.innerWidth;
        canvasElement.height = window.innerHeight;
        flippedCanvas.width = canvasElement.width;
        flippedCanvas.height = canvasElement.height;
        
        const dot = document.createElement('canvas');
        dot.width = 10; dot.height = 10;
        const dctx = dot.getContext('2d');
        dctx.fillStyle = 'white'; dctx.fillRect(0,0,10,10);
        dctx.fillStyle = '#444'; 
        dctx.beginPath(); dctx.arc(5,5, 3.5, 0, Math.PI*2); dctx.fill();
        halftonePattern = ctx.createPattern(dot, 'repeat');

        const noise = document.createElement('canvas');
        noise.width = 128; noise.height = 128;
        const nctx = noise.getContext('2d');
        const imgData = nctx.createImageData(128, 128);
        for(let i=0; i<imgData.data.length; i+=4) {
            const v = Math.random() * 255;
            imgData.data[i] = v; imgData.data[i+1] = v; imgData.data[i+2] = v; imgData.data[i+3] = 45; 
        }
        nctx.putImageData(imgData, 0, 0);
        noisePattern = ctx.createPattern(noise, 'repeat');

        duotoneGradient = ctx.createLinearGradient(0, 0, canvasElement.width, canvasElement.height);
        duotoneGradient.addColorStop(0, '#ff007f');
        duotoneGradient.addColorStop(1, '#00e5ff');
    }
    window.addEventListener('resize', resizeAndGeneratePatterns);
    resizeAndGeneratePatterns();

    function getIntersection(p1, p2, p3, p4) {
        const det = (p1.x - p2.x) * (p3.y - p4.y) - (p1.y - p2.y) * (p3.x - p4.x);
        if (Math.abs(det) < 0.1) return null; 
        const x = ((p1.x * p2.y - p1.y * p2.x) * (p3.x - p4.x) - (p1.x - p2.x) * (p3.x * p4.y - p3.y * p4.x)) / det;
        const y = ((p1.x * p2.y - p1.y * p2.x) * (p3.y - p4.y) - (p1.y - p2.y) * (p3.x * p4.y - p3.y * p4.x)) / det;
        return { x, y };
    }

    function drawFilteredArea(points, effect) {
        if(points.length < 3) return;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
        ctx.closePath();
        
        ctx.clip(); 

        if (effect === 'pixelate') {
            const pixelSize = 12;
            smallCanvas.width = canvasElement.width / pixelSize;
            smallCanvas.height = canvasElement.height / pixelSize;
            smallCtx.drawImage(flippedCanvas, 0, 0, smallCanvas.width, smallCanvas.height);
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(smallCanvas, 0, 0, canvasElement.width, canvasElement.height);
            ctx.imageSmoothingEnabled = true;
            
        } else if (effect === 'halftone') {
            ctx.filter = 'grayscale(100%) contrast(150%)';
            ctx.drawImage(flippedCanvas, 0, 0);
            ctx.filter = 'none';
            ctx.globalCompositeOperation = 'multiply';
            ctx.fillStyle = halftonePattern;
            ctx.fillRect(0, 0, canvasElement.width, canvasElement.height);

        } else if (effect === 'gradientMap') {
            ctx.filter = 'grayscale(100%) contrast(180%)';
            ctx.drawImage(flippedCanvas, 0, 0);
            ctx.filter = 'none';
            ctx.globalCompositeOperation = 'color';
            ctx.fillStyle = duotoneGradient;
            ctx.fillRect(0, 0, canvasElement.width, canvasElement.height);

        } else if (effect === 'noise') {
            ctx.filter = 'sepia(80%) contrast(130%) saturate(150%)';
            ctx.drawImage(flippedCanvas, 0, 0);
            ctx.filter = 'none';
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillStyle = noisePattern;
            ctx.fillRect(0, 0, canvasElement.width, canvasElement.height);
        }
        ctx.restore();
    }

    function drawLines(points, isClosed) {
        if (!points || points.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
        }
        if (isClosed) ctx.closePath();
        
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.stroke();
    }

    function getDist(p1, p2) {
        return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
    }

    function onResults(results) {
        if (!videoElement.videoWidth) return;

        const videoRatio = videoElement.videoWidth / videoElement.videoHeight;
        const canvasRatio = canvasElement.width / canvasElement.height;
        
        if (canvasRatio > videoRatio) {
            renderWidth = canvasElement.width;
            renderHeight = canvasElement.width / videoRatio;
            xOffset = 0;
            yOffset = (canvasElement.height - renderHeight) / 2;
        } else {
            renderWidth = canvasElement.height * videoRatio;
            renderHeight = canvasElement.height;
            xOffset = (canvasElement.width - renderWidth) / 2;
            yOffset = 0;
        }

        flippedCtx.clearRect(0, 0, flippedCanvas.width, flippedCanvas.height);
        flippedCtx.save();
        flippedCtx.translate(xOffset + renderWidth, yOffset);
        if (configLens === 'user') {
            flippedCtx.scale(-1, 1);
        } else {
            flippedCtx.translate(-renderWidth, 0); 
        }
        flippedCtx.drawImage(videoElement, 0, 0, renderWidth, renderHeight);
        flippedCtx.restore();

        ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        ctx.drawImage(flippedCanvas, 0, 0);

        let rawPoints = [];

        if (results.multiHandLandmarks && results.multiHandedness) {
            for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                const landmarks = results.multiHandLandmarks[i];
                const handedness = results.multiHandedness[i].label; // 'Left' or 'Right'

                const mapPoint = (lm, effectName) => {
                    let mappedX = lm.x;
                    if (configLens === 'user') mappedX = 1 - lm.x;
                    return {
                        x: xOffset + mappedX * renderWidth,
                        y: yOffset + lm.y * renderHeight,
                        effect: effectName
                    };
                };

                if (handedness === 'Right') {
                    rawPoints.push(mapPoint(landmarks[4], 'pixelate')); 
                    rawPoints.push(mapPoint(landmarks[8], 'noise'));     
                } else {
                    rawPoints.push(mapPoint(landmarks[4], 'gradientMap')); 
                    rawPoints.push(mapPoint(landmarks[8], 'halftone'));   
                }
            }
        }

        let mergedPoints = [];
        const MERGE_THRESHOLD = canvasElement.width * 0.08; 

        for (let pt of rawPoints) {
            let isMerged = false;
            for (let mPt of mergedPoints) {
                if (getDist(pt, mPt) < MERGE_THRESHOLD) {
                    mPt.x = (mPt.x * mPt.count + pt.x) / (mPt.count + 1);
                    mPt.y = (mPt.y * mPt.count + pt.y) / (mPt.count + 1);
                    mPt.count++;
                    isMerged = true;
                    break;
                }
            }
            if (!isMerged) {
                mergedPoints.push({ x: pt.x, y: pt.y, count: 1, effect: pt.effect });
            }
        }

        if (mergedPoints.length === 2) {
            drawLines([mergedPoints[0], mergedPoints[1]], false);
            if(!isRecording) statusText.innerText = `TRACKING: 2 POINTS`;

        } else if (mergedPoints.length === 4) {
            let cx = (mergedPoints[0].x + mergedPoints[1].x + mergedPoints[2].x + mergedPoints[3].x) / 4;
            let cy = (mergedPoints[0].y + mergedPoints[1].y + mergedPoints[2].y + mergedPoints[3].y) / 4;
            
            mergedPoints.sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));

            let P0 = mergedPoints[0];
            let P1 = mergedPoints[1];
            let P2 = mergedPoints[2];
            let P3 = mergedPoints[3];

            const center = getIntersection(P0, P2, P1, P3) || {x: cx, y: cy};

            drawFilteredArea([P0, P1, center], P0.effect); 
            drawFilteredArea([P1, P2, center], P1.effect);  
            drawFilteredArea([P2, P3, center], P2.effect); 
            drawFilteredArea([P3, P0, center], P3.effect);    

            drawLines([P0, P1, P2, P3], true); 
            drawLines([P0, center, P1], false); 
            drawLines([P2, center, P3], false); 
            
            if(!isRecording) statusText.innerText = `TRACKING: 4 POINTS`;
        } else {
            if(!isRecording) statusText.innerText = `TRACKING: WAITING...`;
        }

        if (isRecording) {
            ctx.save();
            ctx.font = "600 16px Inter, sans-serif";
            ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
            ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 1;
            ctx.shadowOffsetY = 1;
            
            ctx.textAlign = "left";
            ctx.fillText("© 2026 RaDeripper", 30, canvasElement.height - 30);

            ctx.textAlign = "center";
            ctx.fillText("Recorded by manualtracking.vercel.app", canvasElement.width / 2, canvasElement.height - 30);
            
            ctx.restore();
        }
    }

    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1, 
        minDetectionConfidence: 0.5, 
        minTrackingConfidence: 0.5   
    });
    hands.onResults(onResults);

    async function startCustomCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        if (currentLoopId) {
            cancelAnimationFrame(currentLoopId);
        }

        const constraints = {
            video: {
                facingMode: configLens,
                width: { ideal: configWidth },
                height: { ideal: configHeight },
                frameRate: { ideal: configFps }
            }
        };

        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoElement.srcObject = currentStream;
            
            const track = currentStream.getVideoTracks()[0];
            const settings = track.getSettings();
            resInfo.innerText = `${settings.width}x${settings.height} - ${settings.frameRate}FPS`;

            await new Promise((resolve) => {
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    resolve();
                };
            });

            async function detectionLoop() {
                if (!videoElement.paused && !videoElement.ended && videoElement.readyState >= 2) {
                    if (videoElement.currentTime !== lastVideoTime) {
                        lastVideoTime = videoElement.currentTime;
                        await hands.send({ image: videoElement });
                    }
                }
                currentLoopId = requestAnimationFrame(detectionLoop);
            }
            detectionLoop();

        } catch (error) {
            console.error(error);
            document.getElementById('loading-text').innerText = "ERROR: Camera/Hardware Access Denied.";
            resInfo.innerText = "ERROR";
        }
    }

    document.getElementById('start-btn').addEventListener('click', async () => {
        document.getElementById('start-btn').classList.add('hidden');
        document.getElementById('loading-text').classList.remove('hidden');
        
        // Request Fullscreen Safely
        try {
            if (document.documentElement.requestFullscreen) {
                await document.documentElement.requestFullscreen();
            }
        } catch(e) {
            console.log("Fullscreen restriction bypassed");
        }
        
        await startCustomCamera();
        
        const startScreen = document.getElementById('start-screen');
        startScreen.style.opacity = '0';
        setTimeout(() => startScreen.style.display = 'none', 700);
        document.getElementById('ui-layer').style.opacity = '1';
    });

</script>
</body>
</html>
