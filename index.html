<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>v1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            overflow: hidden;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }
        #input_video {
            display: none;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @media screen and (orientation: portrait) {
            #rotate-warning { display: flex !important; }
        }
    </style>
</head>
<body class="text-white h-screen w-screen relative select-none">

    <!-- Force Landscape Warning -->
    <div id="rotate-warning" class="hidden absolute inset-0 z-[100] bg-black/95 flex-col items-center justify-center text-center p-6">
        <svg class="w-12 h-12 mb-4 animate-bounce text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
        <p class="tracking-widest text-sm uppercase">Please Rotate to Landscape</p>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/90 backdrop-blur-md transition-opacity duration-700">
        <h1 class="text-3xl font-light tracking-[0.2em] mb-4">GEOMETRIC AR</h1>
        <p class="text-white/50 text-xs mb-8 tracking-wider text-center max-w-md px-4 leading-relaxed">
            2 Fingers = Connect Line.<br>
            3 Fingers = Halftone Dots.<br>
            4 Fingers = Multi-FX Geometry.<br>
            Ensure well-lit environment.
        </p>
        <button id="start-btn" class="glass-panel px-8 py-3 rounded-full uppercase tracking-widest text-sm hover:bg-white/10 transition-colors border-white/20">
            Initialize Camera
        </button>
        <div id="loading-text" class="hidden mt-6 text-white/50 text-xs tracking-widest animate-pulse uppercase">
            Waking up Neural Net...
        </div>
    </div>

    <!-- Main Render Targets -->
    <video id="input_video" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer" class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-6 opacity-0 transition-opacity duration-1000">
        <!-- Top Info -->
        <div class="flex justify-between items-start w-full">
            <div class="flex items-center space-x-3">
                <div class="w-2 h-2 rounded-full bg-white animate-pulse"></div>
                <span id="status-text" class="text-[10px] uppercase tracking-[0.2em] font-semibold text-white/80">TRACKING: SEARCHING...</span>
            </div>
            <div class="text-[10px] uppercase tracking-[0.2em] text-white/50">
                1080P - 60FPS
            </div>
        </div>

        <!-- Controls -->
        <div class="flex justify-between items-end w-full">
            <div class="w-16 h-16 rounded-full border border-white/30 flex items-center justify-center p-1 backdrop-blur-sm pointer-events-auto cursor-pointer hover:border-white transition-colors" onclick="flashScreen()">
                <div class="w-full h-full bg-white/20 rounded-full"></div>
            </div>
        </div>
    </div>

    <div id="flash" class="absolute inset-0 z-[100] bg-white opacity-0 pointer-events-none transition-opacity duration-100"></div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const ctx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status-text');

    // Offscreen buffers to handle the "Mirror Bug" and effects flawlessly
    const flippedCanvas = document.createElement('canvas');
    const flippedCtx = flippedCanvas.getContext('2d');
    const smallCanvas = document.createElement('canvas');
    const smallCtx = smallCanvas.getContext('2d');

    // Patterns for FX
    let halftonePattern, noisePattern, duotoneGradient;

    // Viewport Math
    let renderWidth, renderHeight, xOffset, yOffset;

    function flashScreen() {
        const flash = document.getElementById('flash');
        flash.style.opacity = '1';
        setTimeout(() => flash.style.opacity = '0', 100);
    }

    function resizeAndGeneratePatterns() {
        canvasElement.width = window.innerWidth;
        canvasElement.height = window.innerHeight;
        flippedCanvas.width = canvasElement.width;
        flippedCanvas.height = canvasElement.height;
        
        // Pattern 1: Halftone / Polka Dot (Noise Bulat)
        const dot = document.createElement('canvas');
        dot.width = 10; dot.height = 10;
        const dctx = dot.getContext('2d');
        dctx.fillStyle = 'white'; dctx.fillRect(0,0,10,10);
        dctx.fillStyle = '#444'; 
        dctx.beginPath(); dctx.arc(5,5, 3.5, 0, Math.PI*2); dctx.fill();
        halftonePattern = ctx.createPattern(dot, 'repeat');

        // Pattern 2: Film Grain
        const noise = document.createElement('canvas');
        noise.width = 128; noise.height = 128;
        const nctx = noise.getContext('2d');
        const imgData = nctx.createImageData(128, 128);
        for(let i=0; i<imgData.data.length; i+=4) {
            const v = Math.random() * 255;
            imgData.data[i] = v; imgData.data[i+1] = v; imgData.data[i+2] = v; imgData.data[i+3] = 45; 
        }
        nctx.putImageData(imgData, 0, 0);
        noisePattern = ctx.createPattern(noise, 'repeat');

        // Gradient: Cyber Duotone
    duotoneGradient = ctx.createLinearGradient(0, 0, canvasElement.width, canvasElement.height);
    duotoneGradient.addColorStop(0, '#ff007f');
    duotoneGradient.addColorStop(1, '#00e5ff');
}
window.addEventListener('resize', resizeAndGeneratePatterns);
resizeAndGeneratePatterns();

// Find absolute intersection point of two diagonal lines
function getIntersection(p1, p2, p3, p4) {
    const det = (p1.x - p2.x) * (p3.y - p4.y) - (p1.y - p2.y) * (p3.x - p4.x);
    if (Math.abs(det) < 0.1) return null; // Parallel/identical lines protection
    const x = ((p1.x * p2.y - p1.y * p2.x) * (p3.x - p4.x) - (p1.x - p2.x) * (p3.x * p4.y - p3.y * p4.x)) / det;
    const y = ((p1.x * p2.y - p1.y * p2.x) * (p3.y - p4.y) - (p1.y - p2.y) * (p3.x * p4.y - p3.y * p4.x)) / det;
    return { x, y };
}

function drawFilteredArea(points, effect) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
        ctx.closePath();
        
        ctx.clip(); // Masking to the geometric shape

        if (effect === 'pixelate') {
            // Draw pixelated image by downscaling then upscaling
            const pixelSize = 12;
            smallCanvas.width = canvasElement.width / pixelSize;
            smallCanvas.height = canvasElement.height / pixelSize;
            smallCtx.drawImage(flippedCanvas, 0, 0, smallCanvas.width, smallCanvas.height);
            
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(smallCanvas, 0, 0, canvasElement.width, canvasElement.height);
            ctx.imageSmoothingEnabled = true;
            
        } else if (effect === 'halftone') {
            ctx.filter = 'grayscale(100%) contrast(150%)';
            ctx.drawImage(flippedCanvas, 0, 0);
            ctx.filter = 'none';
            ctx.globalCompositeOperation = 'multiply';
            ctx.fillStyle = halftonePattern;
            ctx.fillRect(0, 0, canvasElement.width, canvasElement.height);

        } else if (effect === 'noise') {
            ctx.filter = 'sepia(80%) contrast(130%) saturate(150%)';
            ctx.drawImage(flippedCanvas, 0, 0);
            ctx.filter = 'none';
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillStyle = noisePattern;
            ctx.fillRect(0, 0, canvasElement.width, canvasElement.height);

        } else if (effect === 'duotone') {
            ctx.filter = 'grayscale(100%) contrast(150%)';
            ctx.drawImage(flippedCanvas, 0, 0);
            ctx.filter = 'none';
            ctx.globalCompositeOperation = 'overlay'; // screen or overlay for cyber vibe
            ctx.fillStyle = duotoneGradient;
            ctx.fillRect(0, 0, canvasElement.width, canvasElement.height);
        }
        
        ctx.restore();
    }

    function drawLines(points, isClosed) {
        if (!points || points.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
        }
        if (isClosed) ctx.closePath();
        
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.stroke();
    }

    function getDist(p1, p2) {
        return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
    }

    function onResults(results) {
        if (!videoElement.videoWidth) return;

        // 1. Precise Math to scale video to "Object-Fit: Cover" 
        const videoRatio = videoElement.videoWidth / videoElement.videoHeight;
        const canvasRatio = canvasElement.width / canvasElement.height;
        
        if (canvasRatio > videoRatio) {
            renderWidth = canvasElement.width;
            renderHeight = canvasElement.width / videoRatio;
            xOffset = 0;
            yOffset = (canvasElement.height - renderHeight) / 2;
        } else {
            renderWidth = canvasElement.height * videoRatio;
            renderHeight = canvasElement.height;
            xOffset = (canvasElement.width - renderWidth) / 2;
            yOffset = 0;
        }

        // 2. Pre-render a perfectly mirrored frame to Offscreen Buffer
        flippedCtx.clearRect(0, 0, flippedCanvas.width, flippedCanvas.height);
        flippedCtx.save();
        flippedCtx.translate(xOffset + renderWidth, yOffset);
        flippedCtx.scale(-1, 1);
        flippedCtx.drawImage(videoElement, 0, 0, renderWidth, renderHeight);
        flippedCtx.restore();

        // 3. Draw Normal Background
        ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        ctx.drawImage(flippedCanvas, 0, 0);

        let rawPoints = [];
        // Kita siapkan 4 efek yang akan "diikat" ke masing-masing 4 jari
        const effectsList = ['pixelate', 'duotone', 'halftone', 'noise'];
        let ptIdx = 0;

        if (results.multiHandLandmarks) {
            for (const landmarks of results.multiHandLandmarks) {
                // Sekarang setiap titik yang dipetakan akan MEMBAWA properti "effect"-nya sendiri
                const mapPoint = (lm, effectName) => ({
                    x: xOffset + (1 - lm.x) * renderWidth,
                    y: yOffset + lm.y * renderHeight,
                    effect: effectName
                });
                rawPoints.push(mapPoint(landmarks[4], effectsList[ptIdx % 4])); ptIdx++; // Jempol
                rawPoints.push(mapPoint(landmarks[8], effectsList[ptIdx % 4])); ptIdx++; // Telunjuk
            }
        }

        // --- SISTEM MERGE TITIK (Deteksi Jari Menempel / Cubitan) ---
        let mergedPoints = [];
        // Toleransi jarak menempel (sekitar 8% dari lebar layar)
        const MERGE_THRESHOLD = canvasElement.width * 0.08; 

        for (let pt of rawPoints) {
            let isMerged = false;
            for (let mPt of mergedPoints) {
                if (getDist(pt, mPt) < MERGE_THRESHOLD) {
                    // Gabungkan di titik tengah
                    mPt.x = (mPt.x * mPt.count + pt.x) / (mPt.count + 1);
                    mPt.y = (mPt.y * mPt.count + pt.y) / (mPt.count + 1);
                    mPt.count++;
                    isMerged = true;
                    break;
                }
            }
            if (!isMerged) {
                // Titik baru lahir, dia mewarisi efek bawaannya!
                mergedPoints.push({ x: pt.x, y: pt.y, count: 1, effect: pt.effect });
            }
        }

        // --- RENDER AREA BERDASARKAN JUMLAH TITIK SETELAH DIGABUNG ---
        if (mergedPoints.length === 2) {
            drawLines([mergedPoints[0], mergedPoints[1]], false);
            statusText.innerText = `TRACKING: 2 POINTS`;

        } else if (mergedPoints.length === 3) {
            // Segitiga akan menggunakan efek dari jari pertama pembentuknya
            drawFilteredArea([mergedPoints[0], mergedPoints[1], mergedPoints[2]], mergedPoints[0].effect);
            drawLines([mergedPoints[0], mergedPoints[1], mergedPoints[2]], true);
            statusText.innerText = `TRACKING: 3 POINTS`;

        } else if (mergedPoints.length === 4) {
            
            // ANTI-BOCOR: Mengurutkan secara melingkar
            let cx = (mergedPoints[0].x + mergedPoints[1].x + mergedPoints[2].x + mergedPoints[3].x) / 4;
            let cy = (mergedPoints[0].y + mergedPoints[1].y + mergedPoints[2].y + mergedPoints[3].y) / 4;
            
            mergedPoints.sort((a, b) => {
                return Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx);
            });

            let P0 = mergedPoints[0];
            let P1 = mergedPoints[1];
            let P2 = mergedPoints[2];
            let P3 = mergedPoints[3];

            // Cari perpotongan absolut garis silang (X)
            const center = getIntersection(P0, P2, P1, P3);

            if (center) {
                // MAGIC-NYA DI SINI: Efek dirender berdasarkan JATI DIRI titiknya (P0.effect, P1.effect, dst)
                // Jadi kalau jarimu diputar (P0 pindah ke bawah), filternya akan otomatis ikut ke bawah!
                drawFilteredArea([P0, P1, center], P0.effect); 
                drawFilteredArea([P1, P2, center], P1.effect);  
                drawFilteredArea([P2, P3, center], P2.effect); 
                drawFilteredArea([P3, P0, center], P3.effect);    

                drawLines([P0, P1, P2, P3], true); 
                drawLines([P0, P2], false); 
                drawLines([P1, P3], false); 
            }
            
            statusText.innerText = `TRACKING: 4 POINTS`;
        } else {
            statusText.innerText = `TRACKING: ${mergedPoints.length} POINTS`;
        }
    }

const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1, 
    minDetectionConfidence: 0.5, // Diturunkan agar lebih agresif menangkap tangan meskipun buram
    minTrackingConfidence: 0.5   // Diturunkan agar tracking lebih menempel dan ugal-ugalan
});
hands.onResults(onResults);

    document.getElementById('start-btn').addEventListener('click', async () => {
        document.getElementById('start-btn').classList.add('hidden');
        document.getElementById('loading-text').classList.remove('hidden');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
            });
            videoElement.srcObject = stream;
            
            videoElement.onloadedmetadata = () => {
                videoElement.play();
                const camera = new Camera(videoElement, {
                    onFrame: async () => await hands.send({image: videoElement}),
                    width: 1280, height: 720
                });
                
                camera.start().then(() => {
                    const startScreen = document.getElementById('start-screen');
                    startScreen.style.opacity = '0';
                    setTimeout(() => startScreen.style.display = 'none', 700);
                    document.getElementById('ui-layer').style.opacity = '1';
                });
            };
        } catch (error) {
            console.error(error);
            document.getElementById('loading-text').innerText = "ERROR: Camera Access Denied.";
        }
    });

</script>
</body>
</html>
